name: Validar páginas do portfólio

on:
  push:
    branches: [gh-pages]
    paths:
      - "index.html"
      - "qualidade.html"
      - "tests/**"
      - ".github/workflows/portfolio-validation.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - "index.html"
      - "qualidade.html"
      - "tests/**"
      - ".github/workflows/portfolio-validation.yml"

permissions:
  contents: read

jobs:
  static-validation:
    name: Validar HTML e JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checar links, HTML e JavaScript
        run: node tests/validate-pages.cjs
      - name: Preparar testes de comportamento da main
        uses: actions/checkout@v4
        with:
          ref: main
          path: regression
          persist-credentials: false
      - name: Executar regressões de interface e controle GO/NO-GO
        run: node regression/tests/test_dashboard.cjs index.html qualidade.html
