name: Atualizar portfólio AXE
on:
  schedule:
    - cron: '7-57/5 * * * *'
  # O schedule do GitHub Actions é best-effort: execuções podem atrasar.
  # O painel público consulta a API diretamente quando o snapshot atrasa.
  # Inclusão AXE Fomento: o coletor lê os 10 projetos e respectivos marcos do
  # HTML revisado na branch gh-pages; não presume implementação nem GO.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-refresh.yml'
      - 'scripts/refresh_portfolio.py'
      - 'tests/test_portfolio.py'
      - 'tests/test_dashboard.cjs'

permissions:
  contents: write
  actions: read

concurrency:
  group: axe-portfolio-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do coletor
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout da branch do site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Validar parser de marcos e regressões
        run: python3 -m unittest discover -s source/tests -p 'test_portfolio.py' -v

      - name: Validar interface e modos de atualização
        run: node source/tests/test_dashboard.cjs pages/index.html pages/qualidade.html

      - name: Coletar dados públicos dos projetos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 source/scripts/refresh_portfolio.py --output pages/portfolio-status.json --html pages/index.html

      - name: Publicar snapshot
        working-directory: pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio-status.json
          if git diff --cached --quiet; then
            echo 'Snapshot sem alterações.'
            exit 0
          fi
          git commit -m 'chore(portfolio): atualizar snapshot de projetos [skip ci]'
          # Reconcile parallel Pages writes from docs edits and the scheduler.
          for attempt in 1 2 3 4; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              echo 'Snapshot publicado com sucesso.'
              exit 0
            fi
            echo "Push simultâneo; repetindo tentativa ${attempt}/4."
            sleep "${attempt}"
          done
          echo 'Falha ao publicar snapshot após quatro tentativas.' >&2
          exit 1
