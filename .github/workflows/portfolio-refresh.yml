name: Atualizar portfólio AXE
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axe-portfolio-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do coletor
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout da branch do site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Coletar dados públicos dos projetos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 source/scripts/refresh_portfolio.py --output pages/portfolio-status.json

      - name: Publicar snapshot
        working-directory: pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio-status.json
          if git diff --cached --quiet; then
            echo 'Snapshot sem alterações.'
            exit 0
          fi
          git commit -m 'chore(portfolio): atualizar snapshot de projetos [skip ci]'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
